function dateText(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(d.valueOf())?String(value):d.toLocaleString('uz-UZ',{timeZone:'Asia/Tashkent',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}

function speak(events){if(!state.audio||!('speechSynthesis' in window))return;for(const e of events){const i=Math.max(0,languages.indexOf(e.lang));let message=(state.settings.voice_templates?.[i]||defaults.voice_templates[i]).replaceAll('{navbat}',number(e.ticket)).replaceAll('{operator}',String(e.operator));const line=new SpeechSynthesisUtterance(message);line.lang=['uz-UZ','ru-RU','en-GB'][i];line.volume=Number(state.settings.volume??.75);speechSynthesis.speak(line)}}

.map(([code,label])=>`<a class="button-link" href="/kiosk?lang=${code}" target="_blank">Kiosk · ${label} ↗</a>`).join('')}<a class="button-link" href="/tv" target="_blank">TV ↗</a></div><div id="settings-preview"></div><details style="margin:20px 0"><summary style="cursor:pointer;font-weight:700">Katalog va operator yorliqlari — kengaytirilgan JSON</summary><p class="muted" style="margin-top:15px">catalog: 5×5 xizmat va tarjimalari; hidden_services: yashirilgan xizmat indekslari, masalan ["0:1"]; operator_labels: operator yorliqlari. Mavjud xizmat indekslarini köçirmang.</p>${area('Kengaytirilgan sozlamalar','advanced_settings',JSON.stringify({catalog:current.catalog||state.catalog,hidden_services:current.hidden_services||[],operator_labels:current.operator_labels||{}},null,2),'class="json-editor" required')}</details><button class="primary" type="submit">✓ Sozlamalarni saqlaş</button></form></section><section class="panel" style="margin-top:20px"><h2>Bölim logotipi</h2><p class="muted">PNG yoki JPEG, eng köpi 2 MB. Saqlangan logotip kioskda körinadi.</p><form id="logo-form"><div class="two-col">${select('Bölim','section',state.catalog.map((x,i)=>[i,x[0][0]]),0)}<label class="field">Logotip fayli<input id="logo-file" type="file" accept="image/png,image/jpeg" required></label></div><div id="logo-preview" style="margin:15px 0"></div><button class="primary" type="submit">Logotipni saqlaş</button></form></section>`;
 let chosenLanguage=0;
 const form=$('#settings-form');
 $('#settings-language-tabs').querySelectorAll('[data-settings-lang]').forEach(b=>b.onclick=()=>{chosenLanguage=Number(b.dataset.settingsLang);$('#settings-language-tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-language-form]').forEach(x=>x.hidden=Number(x.dataset.languageForm)!==chosenLanguage)});
 function values(){const data=Object.fromEntries(new FormData(form));const settings=JSON.parse(data.advanced_settings);settings.tv_language=data.tv_language;settings.warning_hours=Number(data.warning_hours);settings.volume=Number(data.volume);settings.blink_count=Number(data.blink_count);for(const key of ['university','office','receipt_footer','voice_templates'])settings[key]=languages.map((_,i)=>data[key+'_'+i]);settings.tv_titles=languages.map((_,i)=>[0,1,2].map(j=>data['tv_title_'+i+'_'+j]));return settings}
 $('#preview-receipt').onclick=()=>{try{const settings=values(),i=chosenLanguage;$('#settings-preview').innerHTML=`<div class="receipt"><p>${esc(settings.university[i])}</p><p><strong>${esc(settings.office[i])}</strong></p><p>${esc(words[i][3])}</p><h2>A-025</h2><p><strong>${esc(words[i][4])}</strong><br>${esc(settings.catalog[0][1][0][i])}</p><p>${esc(words[i][13])} · ${esc(dateText(new Date().toISOString()))}</p><p>${esc(settings.receipt_footer[i])}</p></div>`}catch(e){toast(e.message,true)}};
 form.onsubmit=async e=>{e.preventDefault();try{const response=await api('/api/admin/settings',{settings:values()});state.settings={...defaults,...response.settings};state.catalog=state.settings.catalog||state.catalog;toast('Sozlamalar saqlandi');settingsView()}catch(err){toast(err.message,true)}};
 const logoForm=$('#logo-form');let image=null;
 function logoPreview(){const section=Number(logoForm.elements.section.value);const source=image?.url||state.settings.section_logos?.[section];$('#logo-preview').innerHTML=source?`<img src="${esc(source)}" alt="Bölim logotipi" style="width:110px;height:110px;object-fit:contain;border:1px solid #c7dce3;border-radius:15px;background:#eff9f8;padding:10px">`:'<p class="muted">Hozir standart belgi ishlatiladi.</p>'}logoPreview();logoForm.elements.section.onchange=()=>{image=null;$('#logo-file').value='';logoPreview()};
 $('#logo-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg'].includes(file.type)||file.size>2*1024*1024){toast('PNG/JPEG va 2 MBgacha fayl tanlang',true);e.target.value='';image=null;return}const reader=new FileReader();reader.onload=()=>{image={url:reader.result,mime:file.type};logoPreview()};reader.readAsDataURL(file)};
 logoForm.onsubmit=async e=>{e.preventDefault();if(!image){toast('Logotip faylini tanlang',true);return}try{const response=await api('/api/admin/logo',{section:Number(logoForm.elements.section.value),mime:image.mime,data:image.url.split(',')[1]});state.settings={...defaults,...response.settings};toast('Logotip saqlandi; kioskda yangilanadi');settingsView()}catch(err){toast(err.message,true)}};
}
async function auditView(){try{const events=(await api('/api/audit')).events;$('#work').innerHTML=pageHead('Audit jurnali','Muhim amallar va özgarişlar tarixi.')+`<section class="panel"><div class="table-wrap"><table><thead><tr><th>Sana va vaqt</th><th>Xodim</th><th>Amal</th><th>Tafsilot</th></tr></thead><tbody>${events.map(e=>`<tr><td>${esc(dateText(e.created_at))}</td><td>${esc(e.actor||'Tizim')}</td><td>${esc(e.action)}</td><td style="white-space:pre-wrap">${esc(typeof e.detail==='object'?JSON.stringify(e.detail):e.detail)}</td></tr>`).join('')}</tbody></table></div></section>`}catch(e){toast(e.message,true)}}
function integrationsView(){$('#work').innerHTML=pageHead('Integratsiyalar','Tashqi xizmatlar holati')+`<div class="integrations"><section class="panel"><h2>HEMIS / LMS</h2><span class="badge amber">Ulanmagan</span><p style="margin-top:18px">Hozir talabalar lokal fayldan yuklanadi. Haqiqiy ulanish uçun API manzili, maydonlar va universitetning ruxsat etilgan autentifikatsiya tartibi kerak.</p></section><section class="panel"><h2>Telegram-bot</h2><span class="badge amber">Ulanmagan</span><p style="margin-top:18px">Hozir xodimlar bildirişnomalari panel içinde ishlaydi. Talabaga bot orqali javob va baholaş yuboriş uçun bot hamda tasdiqlangan akkauntlarni bog‘laş kerak.</p></section></div><div class="helpbox">Tashqi xabar yuborilmadi. Bu lokal sinov versiyasi integratsiyani ulangan deb körsatmaydi.</div>`}
function devicesView(){$('#work').innerHTML=pageHead('Kiosk, TV va tablolar','Bir serverdagi alohida ekranlar. Qurilma protokoli haqiqiy modelga qarab sozlanadi.')+`<div class="grid"><section class="panel"><h2>Kiosk</h2><p>Talaba til, bölim va xizmatni tanlaydi. 80 mm chek brauzer orqali chop etiladi.</p><a class="button-link" href="/kiosk" target="_blank">Kioskni oçiş ↗</a></section><section class="panel"><h2>Umumiy TV</h2><p>Joriy çaqiruv, xizmat körsatilayotgan oynalar va hali çaqirilmagan navbatlar.</p><a class="button-link" href="/tv" target="_blank">TVni oçiş ↗</a></section><section class="panel"><h2>Oyna tablosi</h2><label>Operator raqami<input id="tablo-number" type="number" min="1" max="30" value="${desk}"></label><button id="open-tablo">Tabloni oçiş ↗</button></section></div><div class="helpbox">Info KeyOS, jismoniy printer, LED tablo va avtomatik to‘liq ekran rejimi haqiqiy qurilmalarda hali tekşirilmagan.</div>`;$('#open-tablo').onclick=()=>{const id=Number($('#tablo-number').value);if(id>=1&&id<=30)window.open('/tablo?id='+id,'_blank','noopener')};}
(async()=>{try{const [settings,catalog]=await Promise.all([api('/api/settings'),api('/api/catalog')]);state.settings={...defaults,...settings.settings};state.catalog=catalog;
 if(['kiosk','tv','tablo'].includes(state.page)){if(state.page==='tv')state.lang=Math.max(0,languages.indexOf(state.settings.tv_language));publicShell();if(state.page==='kiosk'){setInterval(async()=>{if(state.section!==null||state.ticket||state.busy)return;try{const settings=(await api('/api/settings')).settings;if(JSON.stringify(settings)!==JSON.stringify(state.settings)){state.settings={...defaults,...settings};state.catalog=state.settings.catalog||state.catalog;kiosk()}}catch{}},10000);try{const saved=JSON.parse(sessionStorage.getItem('navbot-ticket'));if(saved?.id&&languages.includes(saved.lang))state.ticket=saved}catch{}kiosk()}else{if(state.page==='tv'){state.audio=true;$('#controls').hidden=true}publicPoll();setInterval(async()=>{try{const s=(await api('/api/settings')).settings;state.settings={...defaults,...s};if(state.page==='tv'){state.lang=Math.max(0,languages.indexOf(state.settings.tv_language));publicTitle()}}catch{}},10000)}return}
 state.user=(await api('/api/me')).user;if(!state.user){login();return}if(state.page==='login'){location.href='/'+state.user.role;return}desk=state.user.operator||desk;if(state.user.must_change_password){shell();navigate('profile');return}state.users=(await api('/api/users')).users;await refreshPrivate();shell();if(state.user.must_change_password||state.page==='profile')navigate('profile');else if(state.user.role==='director')navigate('report');else navigate('requests');privatePoll();
 }catch(e){app.innerHTML=`<main class="public-main"><section class="panel"><h1>NavBoTni oçib bölmadi</h1><p>${esc(e.message)}</p><button onclick="location.reload()">Qayta uriniş</button></section></main>`}})();
</script></body></html>
