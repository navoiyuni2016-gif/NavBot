<script src="/assets/i18n.js"></script>
<script>
'use strict';
const {t,fmt,html,staticHTML:baseStaticHTML}=window.NavI18n;
function staticHTML(text){return baseStaticHTML(text).replace(/>([✓➤＋◷←→↗])(?=\s|<)/gu,(_,glyph)=>'>'+uiIcon(({'✓':'confirm','➤':'forward','＋':'add','◷':'clock','←':'back','→':'forward','↗':'open'})[glyph],glyph))}
const $=(selector,root=document)=>root.querySelector(selector);
const app=$('#app');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const languages=['uz','ru','en'];
const words=[['Bölimni tanlang','Xizmatni tanlang','Orqaga','Navbat raqami','Murojaat mazmuni','Çekni chop etiş','Yangi navbat','Hozir çaqirilmoqda','Xizmat körsatilmoqda','Kutilayotgan navbatlar','operator','Navbatingizni TVda kuzating','Bölim','Vaqt','Server bilan aloqa uzildi','Özbekça'],['Выберите раздел','Выберите услугу','Назад','Номер очереди','Тема обращения','Печать талона','Новый талон','Сейчас вызывается','Обслуживаются','Ожидают','окно','Следите за очередью на экране','Раздел','Время','Нет связи с сервером','Русский'],['Choose a section','Choose a service','Back','Queue number','Request','Print ticket','New ticket','Now calling','Now serving','Waiting','counter','Watch the queue display','Section','Time','Connection to server lost','English']];
const defaults={university:['Alişer Navoiy nomidagi Toşkent davlat özbek tili va adabiyoti universiteti','Ташкентский государственный университет узбекского языка и литературы имени Алишера Навои','Alisher Navo’i Tashkent State University of Uzbek Language and Literature'],office:['Registrator ofisi','Офис регистратора','Registrar’s Office'],tv_language:'uz',warning_hours:24,volume:.75,blink_count:3,voice_templates:['{navbat}. Iltimos, {operator}-operator oynasiga öting.','Номер {navbat}, подойдите к окну номер {operator}.','Ticket {navbat}, please proceed to counter {operator}.'],receipt_footer:words.map(x=>x[11])};
const roleNames=new Proxy({admin:'Superadmin',manager:'Menejer',executor:'Ijroçi',head:'Bölim boşliği',director:'Direktor'},{get:(target,key)=>t(target[key])});
const statusNames=new Proxy({new:'Yangi',in_progress:'Jarayonda',returned:'Qaytarilgan',pending_approval:'Tasdiq kutilmoqda',closed:'Yakunlangan'},{get:(target,key)=>t(target[key])});
const actionNames=new Proxy({created:'Murojaat röyxatga olindi',queue_start:'Qabul boşlandi',queue_finish:'Qabul tugadi',queue_recall:'Qayta çaqirildi',create:'Röyxatga olindi',update:'Ma’lumotlar yangilandi',assign:'Mas’ulga yönaltirildi',return:'Menejerga qaytarildi',submit:'Tasdiqqa yuborildi',approve:'Tasdiqlandi va yopildi',correct:'Tuzatişga qaytarildi',resolve:'Joyida hal qilindi',deadline:'Muddat özgardi',call:'Çaqirildi',start:'Qabul boşlandi',finish:'Qabul tugadi'},{get:(target,key)=>t(target[key])});
const state={page:location.pathname.slice(1)||'kiosk',lang:0,settings:{...defaults},catalog:[],section:null,ticket:null,key:null,pending:null,busy:false,after:-1,audio:false,lastCall:null,user:null,users:[],requests:[],notifications:[],selected:null,view:'requests',filter:'all',search:'',queue:null,detailVersion:null,noticeOpen:false};
const query=new URLSearchParams(location.search);
state.lang=Math.max(0,languages.indexOf(query.get('lang')||NavI18n.language));NavI18n.setLanguage(languages[state.lang]);
let desk=Math.min(30,Math.max(1,parseInt(query.get('id'),10)||1));
const number=value=>typeof value==='object'&&value!==null?(value.code||((value.prefix||'A')+'-'+String(value.queue_seq||value.id||value.ticket).padStart(3,'0'))):'A-'+String(value).padStart(3,'0');
const tr=n=>words[state.lang][n];
const iconList=[staticHTML("<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 9 12 4l10 5-10 5L2 9Z\"/><path d=\"M6 11v6c4 3 8 3 12 0v-6M22 9v8\"/></svg>"), staticHTML("<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3h6M10 3v7L4 20c-.4.7 0 1 1 1h14c1 0 1.4-.3 1-1l-6-10V3M7 16h10\"/><circle cx=\"12\" cy=\"17\" r=\"1\"/></svg>"), staticHTML("<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><ellipse cx=\"12\" cy=\"12\" rx=\"4\" ry=\"10\"/><path d=\"M2 12h20M4 6h16M4 18h16\"/></svg>"), staticHTML("<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M8 7V4h8v3M3 12c6 4 12 4 18 0M10 13h4v4h-4z\"/></svg>"), staticHTML("<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"4\" width=\"15\" height=\"18\" rx=\"2\"/><path d=\"M9 4V2h6v2M8 10l2 2 4-4M8 17l2 2 4-4M16 10h2M16 17h2\"/></svg>")];
function brandLogo(){const source=state.page==='kiosk'?(state.settings.branding?.kiosk_logo||state.settings.branding?.system_logo):state.settings.branding?.system_logo;return html`<span class="logo" data-brand-logo>${source?html`<img class="brand-image" src="${esc(source)}" alt="NAVBOT">`:staticHTML('<b>◩</b>NAV<i>BOT</i>')}</span>`}
function uiIcon(key,glyph){const source=state.settings.branding?.icons?.[key];return html`<span class="ui-icon" data-ui-icon="${esc(key)}" data-glyph="${esc(glyph)}" aria-hidden="true">${source?html`<img src="${esc(source)}" alt="">`:esc(glyph)}</span>`}
function refreshBranding(){document.querySelectorAll('[data-brand-logo]').forEach(el=>el.outerHTML=brandLogo());document.querySelectorAll('[data-ui-icon]').forEach(el=>{el.outerHTML=uiIcon(el.dataset.uiIcon,el.dataset.glyph)})}

function toast(message,error=false){const el=$('#toast');el.textContent=error&&/^(Unexpected|Expected|JSON\.parse|Failed to fetch|NetworkError|Cannot read|Unexpected end)/.test(String(message))?t('Sörov bajarilmadi'):t(message);el.style.background=error?'#8b2525':'#093c36';el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,6000)}
async function api(path,data){const res=await fetch(path,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await res.json();if(!res.ok){const error=new Error(localizedError(result.error,res.status));error.status=res.status;throw error}return result}
function field(label,name,value='',type='text',extra=''){return html`<label class="field">${esc(t(label))}<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function area(label,name,value='',extra=''){return html`<label class="field">${esc(t(label))}<textarea name="${esc(name)}" ${extra}>${esc(value)}</textarea></label>`}
function select(label,name,options,value=''){return html`<label class="field">${esc(t(label))}<select name="${esc(name)}">${options.map(([v,t])=>html`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(['assignee_id','user_id','manager_id'].includes(name)&&v!==''?t:NavI18n.t(t))}</option>`).join('')}</select></label>`}
function dateText(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(d.valueOf())?String(value):d.toLocaleString(['uz-UZ','ru-RU','en-GB'][state.lang],{timeZone:'Asia/Tashkent',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function localInput(value){const d=value?new Date(value):new Date(Date.now()+86400000);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function timeISO(value){if(!value)return '';return new Date(value).toISOString()}
function serviceName(t,index=languages.indexOf(t.lang)){return state.catalog[t.section]?.[1]?.[t.service]?.[index<0?state.lang:index]||t.content||'—'}
function userName(id){return state.users.find(u=>u.id===id)?.full_name||'—'}
function statusBadge(status){const color={new:'gray',in_progress:'blue',returned:'red',pending_approval:'amber',closed:''}[status]||'';return html`<span class="badge ${color}">${esc(statusNames[status]||t(status))}</span>`}
function notice(message){const el=$('#notice');if(el)el.textContent=t(message||'')}
function publicShell(){document.body.dataset.page=state.page;app.innerHTML=html`<header class="public-header">${brandLogo()}<div class="institution" id="brand"></div></header><main class="public-main"><div id="controls" class="controls"></div><div id="notice" class="notice" role="status"></div><div id="content"></div></main>`;publicTitle()}
function publicTitle(){refreshBranding();document.documentElement.lang=languages[state.lang];$('#brand').textContent=state.page==='tv'?t('ToşDÖTAU')+' · '+state.settings.office[state.lang]:state.settings.university[state.lang]+' · '+state.settings.office[state.lang]}
function kiosk(){state.page='kiosk';document.body.dataset.page='kiosk';publicTitle();const controls=$('#controls'),content=$('#content');controls.innerHTML='';content.innerHTML='';
 if(state.ticket){const t=state.ticket;const i=languages.indexOf(t.lang);state.lang=i<0?state.lang:i;publicTitle();content.innerHTML=html`<section class="receipt"><p>${esc(state.settings.university[state.lang])}</p><p><strong>${esc(state.settings.office[state.lang])}</strong></p><p>${esc(tr(3))}</p><h2>${esc(number(t))}</h2><p>${esc(tr(12))} · ${esc(state.catalog[t.section][0][state.lang])}</p><p><strong>${esc(tr(4))}</strong><br>${esc(t.content||serviceName(t))}</p><p>${esc(tr(13))} · ${esc(dateText(t.created_at||t.created))}</p><p>${esc(state.settings.receipt_footer?.[state.lang]||tr(11))}</p></section><button class="primary" id="print-ticket">${esc(tr(5))}</button> <button id="new-ticket">${esc(tr(6))}</button>`;$('#print-ticket').onclick=()=>window.print();$('#new-ticket').onclick=()=>{state.ticket=null;state.section=null;state.key=null;state.pending=null;sessionStorage.removeItem('navbot-ticket');kiosk()};return}
 controls.innerHTML=($('#ui-utilities')?'':languages.map((l,i)=>html`<button data-lang="${i}" aria-pressed="${i===state.lang}">${esc(words[i][15])}</button>`).join(''))+(state.section!==null?html`<button id="back">${uiIcon('back','←')} ${esc(tr(2))}</button>`:'');controls.querySelectorAll('[data-lang]').forEach(el=>el.onclick=()=>{if(!state.busy&&state.pending===null){state.lang=Number(el.dataset.lang);NavI18n.setLanguage(languages[state.lang]);document.documentElement.lang=languages[state.lang];state.section=null;kiosk()}});if($('#back'))$('#back').onclick=()=>{if(!state.busy&&state.pending===null){state.section=null;kiosk()}};
 const choices=state.section===null?state.catalog.map(x=>x[0]):state.catalog[state.section][1];content.innerHTML=html`<div class="kiosk-title"><p class="eyebrow">NAVBOT · ${esc(state.settings.office[state.lang])}</p><h1>${esc(state.section===null?tr(0):state.catalog[state.section][0][state.lang])}</h1>${state.section===null?'':html`<p class="muted">${esc(tr(1))}</p>`}</div><div class="grid kiosk-grid ${state.section!==null?'section-kiosk':''}">${choices.map((translations,i)=>state.section!==null&&state.settings.hidden_services?.includes(state.section+':'+i)?'':html`<button class="tile" data-choice="${i}" ${state.busy||(state.pending!==null&&state.pending!==i)?'disabled':''}><span class="icon" aria-hidden="true">${state.section===null&&state.settings.section_logos?.[i]?html`<img src="${esc(state.settings.section_logos[i])}" alt="" style="width:56px;height:56px;object-fit:contain;display:block">`:state.section===null?iconList[i]:uiIcon('service','▤')}</span><span>${esc(translations[state.lang])}</span><span class="arrow" aria-hidden="true">${uiIcon('forward','→')}</span></button>`).join('')}</div>`;
 content.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{if(state.section===null){state.section=Number(el.dataset.choice);kiosk()}else issue(Number(el.dataset.choice))});}
async function issue(service){if(state.busy)return;let issuedId=null;state.busy=true;state.pending=service;if(!state.key)state.key=crypto.randomUUID();notice('');kiosk();try{state.ticket=await api('/api/ticket',{lang:languages[state.lang],section:state.section,service,key:state.key});sessionStorage.setItem('navbot-ticket',JSON.stringify(state.ticket));issuedId=state.ticket.id;state.pending=null}catch(e){notice(e.message)}finally{state.busy=false;kiosk()}if(issuedId!==null)requestAnimationFrame(()=>requestAnimationFrame(()=>{if(state.ticket?.id===issuedId){try{window.print()}catch(e){notice(e.message)}}}))}
function operatorLabel(item){return state.settings.operator_labels?.[String(item.operator)]?.[state.lang]||(state.lang===0?item.operator+'-operator':state.lang===1?item.operator+'-е окно':'counter '+item.operator)}
function tvHeading(n){return state.settings.tv_titles?.[state.lang]?.[n]||tr(7+n)}
function serving(q){return html`<section class="panel serving"><h2>${esc(tvHeading(1))}</h2>${q.serving.length?q.serving.map(t=>html`<div class="line target">${esc(operatorLabel(t))} · ${esc(number(t))}</div>`).join(''):staticHTML('<p>—</p>')}</section>`}
function waiting(q){return html`<section class="panel waiting"><h2>${esc(tvHeading(2))}</h2><div class="queue">${q.waiting.length?q.waiting.map(t=>html`<div class="chip">${esc(number(t))}</div>`).join(''):staticHTML('<p>—</p>')}</div></section>`}
function tv(q){const id=q.current?.called??null;if(!$('.tv'))$('#content').innerHTML=html`<div class="tv"><section class="panel current"></section>${serving(q)}${waiting(q)}</div>`;
 const c=$('.current');if(id!==state.lastCall||!c.childElementCount){c.innerHTML=html`<h2>${esc(tvHeading(0))}</h2><div class="call-body"><div class="number">${q.current?esc(number(q.current)):'—'}</div>${q.current?html`<div class="target">→ ${esc(operatorLabel(q.current))}</div>`:''}</div>`;c.classList.remove('pulse');if(id!==null){void c.offsetWidth;c.style.setProperty('--blink',String(state.settings.blink_count??3));c.classList.add('pulse')}state.lastCall=id}
 if($('h2',c))$('h2',c).textContent=tvHeading(0);if($('.target',c)&&q.current)$('.target',c).textContent='→ '+operatorLabel(q.current);$('.serving').outerHTML=serving(q);$('.waiting').outerHTML=waiting(q);}

async function publicPoll(){try{const q=await api('/api/state?'+desk+','+state.after);state.after=q.last;if(state.page==='tv'){tv(q);speak(q.events||[])}else if(state.page==='tablo'){$('#content').innerHTML=html`<section class="desk-display"><h1>${esc(operatorLabel({operator:desk}))}</h1><div class="number">${q.desk?esc(number(q.desk)):'—'}</div></section>`}notice('')}catch(e){notice(tr(14))}setTimeout(publicPoll,700)}
function shell(){document.body.dataset.page='private';app.innerHTML=html`<div class="shell"><aside class="sidebar">${brandLogo()}<div class="uni"><strong>ToşDÖTAU</strong><br>Registrator ofisi</div><nav id="menu"></nav><div class="bottom">NAVBOT<br><br>Talaba ma’lumotlari faqat vakolatli kabinetda.</div></aside><div class="workspace"><header class="topbar"><h2 id="work-title">${esc(roleNames[state.user.role])} iş oynasi</h2><div class="row"><button id="notify-button" aria-label="Bildirişnomalar">${uiIcon('notifications','♧')} <span id="notify-count">0</span></button><button id="profile-button"><span class="avatar">${esc(state.user.full_name?.[0]||'N')}</span> ${esc(roleNames[state.user.role])}</button><button id="logout">Çiqiş</button></div></header><main class="workmain"><div id="notice" class="notice" role="status"></div><div id="work"></div></main></div></div>`;
 mountUtilities();$('#logout').onclick=async()=>{try{await api('/api/logout',{});location.href='/login'}catch(e){toast(e.message,true)}};$('#profile-button').onclick=()=>navigate('profile');$('#notify-button').onclick=toggleNotifications;
 const menu=[['requests','▤','Murojaatlar']];if(['manager','admin'].includes(state.user.role))menu.push(['phone','＋','Yangi murojaat']);if(['head','director','admin'].includes(state.user.role))menu.push(['report','▥','Hisobot'],['students','♧','Talabalar bazasi']);menu.push(['archive','▣','Arxiv'],['notifications','♧','Bildirişnomalar'],['profile','♙','Mening profilim']);if(state.user.role==='admin')menu.push(['users','♧','Xodimlar va loginlar'],['settings','⚙','Tizim sozlamalari'],['audit','▤','Audit jurnali'],['audio','♫','Ovozli çaqiruv']);if(state.user.role==='admin')menu.push(['integrations','↔','Integratsiyalar'],['devices','▣','Kiosk, TV va tablo']);
 $('#menu').innerHTML=menu.map(([key,icon,label])=>html`<button data-view="${key}">${uiIcon(key,icon)} &nbsp; ${esc(t(label))}</button>`).join('');$('#menu').querySelectorAll('button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));}
function pageHead(title,subtitle='',extra=''){return html`<div class="page-head"><div><p class="eyebrow">ToşDÖTAU · Registrator ofisi</p><h1>${esc(t(title))}</h1><p class="muted">${esc(t(subtitle))}</p></div>${extra}</div>`}
function navigate(view){state.view=view;state.detailVersion=null;$('#menu')?.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===(view==='archive'?'archive':view)));notice('');const work=$('#work');if(!work)return;
 if(view==='requests'||view==='archive'){state.filter=view==='archive'?'closed':'all';renderRequests()}
 else if(view==='audio')audioView();else if(view==='profile')profile();else if(view==='phone')phone();else if(view==='notifications')notificationsView();else if(view==='report')reportView();else if(view==='students')studentsView();else if(view==='users')usersView();else if(view==='settings')settingsView();else if(view==='audit')auditView();else if(view==='integrations')integrationsView();else if(view==='devices')devicesView();}
function login(){document.body.dataset.page='login';app.innerHTML=html`<header class="public-header">${brandLogo()}<div class="institution">ToşDÖTAU <small>Registrator ofisi</small></div></header><main class="public-main"><div class="login-layout"><section class="login-art"><p class="eyebrow">Yagona raqamli qabul</p><h1>Murojaatdan<br>natijagaça.</h1><p class="tagline">Navbat, talaba ma’lumotlari, mas’ul ijroçi va javob — bitta tizimda.</p><div class="nav-public"><a class="button-link" href="/kiosk">Kiosk →</a><a class="button-link" href="/tv">TV ekran →</a><a class="button-link" href="/tablo?id=1">1-oyna tablosi →</a></div></section><section class="panel login-card"><h1>Tizimga kiriş</h1><p class="muted">Xodimning şaxsiy kabineti</p><form id="login-form" data-testid="login-form">${field('Foydalanuvçi nomi','username','','text','required autocomplete="username"')}${field('Parol','password','','password','required autocomplete="current-password"')}<div class="notice" id="login-error" role="alert"></div><button class="primary" type="submit">Tizimga kiriş →</button></form></section></div></main>`;
 mountUtilities();$('#login-form').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=$('button',form);button.disabled=true;try{state.user=(await api('/api/login',Object.fromEntries(new FormData(form)))).user;location.href=state.user.must_change_password?'/profile':'/'+({admin:'admin',manager:'manager',executor:'executor',head:'head',director:'director'}[state.user.role]||'manager')}catch(e){$('#login-error').textContent=e.message}finally{button.disabled=false}};}
function filters(){return [['all','Barcha'],['new','Yangi'],['mine','Menga biriktirilgan'],['sent','Men yuborgan'],['returned','Qaytarilgan'],['near','Muddati yaqin'],['overdue','Muddati ötgan'],['pending_approval','Tasdiqqa yuborilgan'],['closed','Arxiv']]}
function visibleRequests(){return state.requests.filter(r=>{if(state.view==='archive'&&r.status!=='closed')return false;if(state.view!=='archive'&&state.filter!=='closed'&&r.status==='closed')return false;const f=state.filter;if(f==='mine'&&r.assignee_id!==state.user.id)return false;if(f==='sent'&&!(r.manager_id===state.user.id&&r.assignee_id&&r.assignee_id!==state.user.id))return false;if(['new','returned','pending_approval','closed'].includes(f)&&r.status!==f)return false;const ms=r.deadline?new Date(r.deadline)-Date.now():null;if(f==='near'&&!(ms!==null&&ms>=0&&ms<=Number(state.settings.warning_hours||24)*3600000))return false;if(f==='overdue'&&!(ms!==null&&ms<0&&r.status!=='closed'))return false;return !state.search||[r.number,r.queue_number,r.content,r.student?.full_name,r.student_id].join(' ').toLowerCase().includes(state.search.toLowerCase())})}

async function loadReport(){try{const q=reportParams();$('#report-download').href='/api/report.xlsx?lang='+languages[state.lang]+'&'+q;const data=await api('/api/report?'+q),s=data.summary;if(state.view!=='report')return;$('#report-result').innerHTML=html`<div class="stats">${[['Jami murojaatlar',s.total,'▤'],['Ijroda',s.in_progress,'◷'],['Keçikkan',s.overdue,'!'],['Yakunlangan',s.closed,'✓']].map(([label,value,symbol])=>html`<div class="stat"><span class="symbol">${uiIcon(({'▤':'requests','◷':'clock','!':'warning','✓':'confirm'})[symbol]||'report',symbol)}</span>${esc(t(label))}<span class="value">${esc(value)}</span><small>Tanlangan davr</small></div>`).join('')}</div><div class="two-col"><section class="panel"><h2>Murojaatlar dinamikasi</h2>${reportChart(data.daily||[])}</section><section class="panel"><h2>Bölimlar kesimida ijro</h2><div class="table-wrap"><table><thead><tr><th>Bölim</th><th>Jami</th><th>Yakunlangan</th><th>Keçikkan</th></tr></thead><tbody>${(data.departments||[]).map(d=>html`<tr><td>${esc(d.department||'Biriktirilmagan')}</td><td>${d.total}</td><td>${d.closed}</td><td>${d.overdue}</td></tr>`).join('')}</tbody></table></div></section></div><section class="panel" style="margin-top:20px"><h2>Murojaatlar reyestri</h2><p class="muted">Muddatida yakunlangan: ${esc(s.on_time)} ta</p><div class="table-wrap"><table><thead><tr><th>Ariza / navbat</th><th>Talaba</th><th>Mazmun</th><th>Kanal</th><th>Menejer / mas’ul</th><th>Muddat</th><th>Holat</th><th>Natija</th></tr></thead><tbody>${(data.requests||[]).map(r=>html`<tr><td>${esc(r.number)}<br><small>${esc(r.queue_number||'—')}</small></td><td>${esc(r.student?.full_name||'—')}<br><small>${esc(r.student?.programme||'')}</small></td><td>${esc(r.content)}</td><td>${esc(channelLabel(r.channel))}</td><td>${esc(r.manager_name||'—')}<br><small>${esc(r.assignee_name||'—')}</small></td><td>${esc(dateText(r.deadline))}</td><td>${statusBadge(r.status)}</td><td>${esc(r.result||'—')}</td></tr>`).join('')||staticHTML('<tr><td colspan="8">Tanlangan davrda ma’lumot yöq.</td></tr>')}</tbody></table></div></section>`}catch(e){toast(e.message,true)}}
function reportChart(daily){if(!daily.length)return staticHTML('<div class="empty">Hali ma’lumot yöq.</div>');const max=Math.max(1,...daily.map(d=>d.total));const pts=daily.map((d,i)=>html`${30+i*540/Math.max(1,daily.length-1)},${175-d.total/max*145}`);return html`<svg class="chart" viewBox="0 0 600 220" role="img" aria-label="Murojaatlar soni kunlar böyiça"><path d="M30 20V175H580" stroke="#cadce4" fill="none"/><polygon points="30,175 ${pts.join(' ')} 570,175" fill="#bcece0"/><polyline points="${pts.join(' ')}" stroke="#008b79" stroke-width="4" fill="none"/>${daily.map((d,i)=>html`<circle cx="${30+i*540/Math.max(1,daily.length-1)}" cy="${175-d.total/max*145}" r="4" fill="#008b79"><title>${esc(d.date)}: ${d.total}</title></circle>`).join('')}<text x="30" y="205" fill="#62788a" font-size="13">${esc(daily[0].date)}</text><text x="570" y="205" text-anchor="end" fill="#62788a" font-size="13">${esc(daily.at(-1).date)}</text></svg>`}
async function studentsView(){try{const response=await api('/api/students');if(state.view!=='students')return;$('#work').innerHTML=pageHead('Talabalar bazasi','Lokal yuklangan baza. LMS sinxronizatsiyasi hali ulanmagan.')+html`<section class="panel"><input id="student-search" placeholder="F.I.Ş., HEMIS ID, guruh…" aria-label="Talabani qidiriş"><div id="students-table"></div></section>${state.user.role==='admin'?html`<section class="panel" style="margin-top:18px"><h2>Talabalarni JSON fayldan yuklaş</h2><p class="muted">HEMIS ID böyiça yangi yozuv qöşiladi yoki mavjud yozuv yangilanadi. Xato bölsa butun import bekor qilinadi.</p><form id="import-form"><label class="field">JSON fayl<input type="file" id="student-file" accept=".json,application/json"></label>${area('Talabalar JSON massivi','students','[]','class="json-editor" required')}<p class="muted">Maydonlar: hemis_id, full_name, faculty, programme, course, student_group, education_form, status.</p><button class="primary" type="submit">Bazaga yuklaş</button></form></section>`:''}`;function render(search=''){const students=response.students.filter(s=>[s.hemis_id,s.full_name,s.student_group,s.programme].join(' ').toLowerCase().includes(search.toLowerCase()));$('#students-table').innerHTML=html`<div class="table-wrap"><table><thead><tr><th>Talaba</th><th>HEMIS ID</th><th>Fakultet / yönaliş</th><th>Kurs</th><th>Ta’lim şekli</th><th>Guruh</th><th>Holat</th></tr></thead><tbody>${students.map(s=>html`<tr><td>${esc(s.full_name)}</td><td>${esc(s.hemis_id)}</td><td>${esc(s.faculty)}<br><small>${esc(s.programme)}</small></td><td>${esc(s.course)}</td><td>${esc(t(s.education_form))}</td><td>${esc(s.student_group)}</td><td>${esc(t(s.status||'Faol'))}</td></tr>`).join('')}</tbody></table></div><p style="margin-top:14px">Jami: ${students.length} ta</p>`}render();if(state.user.role==='admin'){const section=document.createElement('section');section.className='panel';section.style.marginTop='18px';section.innerHTML=html`<h2>Talabalarni Excel fayldan qöşiş</h2><p>Mavjud HEMIS ID yozuvlari özgartirilmaydi. Faqat yangi talabalar qöşiladi.</p><form id="xlsx-import"><label class="field">Excel fayli<input name="file" type="file" accept=".xlsx" required></label><button type="submit" class="primary">Bazaga qöşiş</button><div role="status" id="xlsx-result"></div></form>`;$('#work').append(section);$('#xlsx-import').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button');button.disabled=true;try{const file=form.elements.file.files[0];if(file.size>5*1024*1024)throw new Error(t('Excel fayli 5 MBdan oşmasligi kerak'));const bytes=new Uint8Array(await file.arrayBuffer());let text='';for(let i=0;i<bytes.length;i+=32768)text+=String.fromCharCode(...bytes.subarray(i,i+32768));const result=await api('/api/students/import-xlsx',{data:btoa(text)});$('#xlsx-result').textContent=fmt('Qöşildi: {added}. Mavjud: {skipped}. Özgartirilgan: 0.',result);toast('Talabalar qöşildi');response.students=(await api('/api/students')).students;render($('#student-search').value)}catch(error){toast(error.message,true)}finally{button.disabled=false}}}$('#student-search').oninput=e=>render(e.target.value);$('#student-file')?.addEventListener('change',async e=>{if(e.target.files[0])$('#import-form textarea').value=await e.target.files[0].text()});$('#import-form')?.addEventListener('submit',async e=>{e.preventDefault();try{const students=JSON.parse(new FormData(e.currentTarget).get('students'));const result=await api('/api/students/import',{students});toast(html`Yuklandi: ${result.added} yangi, ${result.updated} yangilangan`);studentsView()}catch(err){toast(err.message,true)}})}catch(e){toast(e.message,true)}}

function routingFields(routes){const configured=routes||state.catalog.map((_,i)=>({section:i,prefix:String.fromCharCode(65+i),operator:i+1}));return html`<h2>Bölim, navbat harfi va operator</h2><p class="muted">Özgarişlar yangi cheklarga qöllanadi. Avval olingan cheklar harfi va operatori saqlanadi.</p><div class="table-wrap"><table><thead><tr><th>Bölim</th><th>Navbat harfi</th><th>Operator raqami</th></tr></thead><tbody>${configured.map(route=>html`<tr><td>${esc(state.catalog[route.section][0][state.lang])}</td><td>${field('Navbat harfi','route_prefix_'+route.section,route.prefix,'text','required maxlength="1" pattern="[A-ZÖĞŞÇa-zöğşç]"')}</td><td>${select('Operator raqami','route_operator_'+route.section,[1,2,3,4,5].map(n=>[n,n+' '+t('operator')]),route.operator)}</td></tr>`).join('')}</tbody></table></div><div class="helpbox">Har bir harfning navbat raqami alohida yuradi: A-001, B-001, C-001. Menejer faqat öz operatoriga biriktirilgan navbatni çaqiradi.</div>`}

function brandingEditor(){return html`<section class="panel" style="margin-top:20px"><h2>Logotiplar va interfeys belgilari</h2><p>Har bir joyga alohida PNG yoki JPEG yuklang. Eng köpi 2 MB.</p><form id="branding-form">${select('Belgi joyi','target',[['system_logo',t('Tizim logotipi')],['kiosk_logo',t('Kiosk logotipi')],...(state.brandingTargets||[]).map(x=>['icon:'+x.key,t('Belgi')+' · '+t(x.label)])],'system_logo')}<div id="branding-preview" class="branding-preview"></div><label class="field">Rasm fayli<input name="file" type="file" accept="image/png,image/jpeg"></label><div class="row"><button type="submit" class="primary">Rasmni saqlaş</button><button type="button" id="branding-reset">Standartga qaytariş</button></div><div id="branding-result" role="status"></div></form></section>`}
function bindBrandingEditor(){const form=$('#branding-form');let chosen=null;function destination(){const value=form.elements.target.value;return value.startsWith('icon:')?{target:'icon',key:value.slice(5)}:{target:value}}function preview(){const dest=destination(),source=chosen?.url||(dest.target==='icon'?state.settings.branding?.icons?.[dest.key]:state.settings.branding?.[dest.target]);$('#branding-preview').innerHTML=source?html`<img src="${esc(source)}" alt="${esc(t('Oldindan körish'))}">`:dest.target==='icon'?uiIcon(dest.key,state.brandingTargets.find(x=>x.key===dest.key)?.glyph||''):html`<p class="muted">Hozir standart belgi ishlatiladi.</p>`}preview();form.elements.target.onchange=()=>{chosen=null;form.elements.file.value='';preview()};form.elements.file.onchange=()=>{const file=form.elements.file.files[0];chosen=null;if(!file){preview();return}if(!['image/png','image/jpeg'].includes(file.type)||file.size>2*1024*1024){toast('PNG/JPEG va 2 MBgacha fayl tanlang',true);form.elements.file.value='';preview();return}const reader=new FileReader();reader.onload=()=>{if(form.elements.file.files[0]!==file)return;chosen={url:reader.result,mime:file.type};preview()};reader.readAsDataURL(file)};async function save(remove){if(!remove&&!chosen){toast('Logotip faylini tanlang',true);return}const buttons=form.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const response=await api('/api/admin/branding',{...destination(),...(remove?{remove:true}:{mime:chosen.mime,data:chosen.url.split(',')[1]})});state.settings={...defaults,...response.settings};chosen=null;form.elements.file.value='';preview();refreshBranding();$('#branding-result').textContent=t('Rasm saqlandi');toast('Rasm saqlandi')}catch(error){toast(error.message,true)}finally{buttons.forEach(b=>b.disabled=false)}}form.onsubmit=event=>{event.preventDefault();save(false)};$('#branding-reset').onclick=()=>save(true)}

 const fields=[...document.querySelectorAll('#work input,#work textarea,#work select,#login-form input')].filter(el=>el.name||el.id).map(el=>({form:el.form?.id,name:el.name,id:el.id,value:el.value,checked:el.checked,files:el.files?[...el.files]:null}));

 const restore=()=>{for(const saved of fields){const form=saved.form?document.getElementById(saved.form):null;const el=saved.id?document.getElementById(saved.id):form?.elements.namedItem(saved.name);if(!el||el.dataset.restored==='yes')continue;if(saved.files&&saved.files.length){const transfer=new DataTransfer();saved.files.forEach(f=>transfer.items.add(f));el.files=transfer.files}else if(el.type!=='file')el.value=saved.value;el.checked=saved.checked;el.dataset.restored='yes';if(el.tagName==='SELECT'||(el.type==='file'&&el.id==='logo-file'))el.dispatchEvent(new Event('change',{bubbles:true}))}};
 const observer=new MutationObserver(restore);observer.observe(app,{childList:true,subtree:true});setTimeout(()=>observer.disconnect(),1800);
 if(['kiosk'].includes(state.page)){kiosk();mountUtilities()}else if(!state.user){login()}else{const view=state.view;const operation=state.operation;shell();navigate(view);if(operation&&chosen()?.id===operation.request_id&&chosen().status!=='closed')actionForm(operation.action,chosen())}restore();
}
function fileSelectionLabel(input){const names=[...input.files].slice(0,3).map(f=>f.name).join(', ');return input.files.length>3?names+' … '+fmt('{count} ta fayl',{count:input.files.length}):names}
function decorateFileInputs(){document.querySelectorAll('input[type=file]').forEach(input=>{if(!input._fileControl){const wrap=document.createElement('span');wrap.className='file-control';const button=document.createElement('button');button.type='button';button.textContent=t('Faylni tanlang');const label=document.createElement('span');label.className='muted';wrap.append(button,label);input.after(wrap);input.classList.add('accessible-file-input');button.onclick=()=>input.click();input.addEventListener('change',()=>{label.textContent=input.files.length?fileSelectionLabel(input):t('Fayl tanlanmagan')});input._fileControl={button,label}}const {label,button}=input._fileControl;if(button.textContent!==t('Faylni tanlang'))button.textContent=t('Faylni tanlang');const text=input.files.length?fileSelectionLabel(input):t('Fayl tanlanmagan');if(label.textContent!==text)label.textContent=text})}
new MutationObserver(decorateFileInputs).observe(app,{childList:true,subtree:true});
document.addEventListener('invalid',e=>{if(e.target.setCustomValidity)e.target.setCustomValidity(t('Maydonni tekşiring'))},true);document.addEventListener('input',e=>{if(e.target.setCustomValidity)e.target.setCustomValidity('')});

(async()=>{try{const [settings,catalog,branding]=await Promise.all([api('/api/settings'),api('/api/catalog'),api('/api/branding')]);state.brandingTargets=branding.targets;state.settings={...defaults,...settings.settings};state.catalog=catalog;
 if(['kiosk','tv','tablo'].includes(state.page)){if(state.page==='tv'){state.lang=Math.max(0,languages.indexOf(state.settings.tv_language));NavI18n.setLanguage(languages[state.lang],false)}publicShell();if(state.page==='kiosk'){mountUtilities();setInterval(async()=>{if(state.section!==null||state.ticket||state.busy)return;try{const settings=(await api('/api/settings')).settings;if(JSON.stringify(settings)!==JSON.stringify(state.settings)){state.settings={...defaults,...settings};state.catalog=state.settings.catalog||state.catalog;kiosk()}}catch{}},10000);try{const saved=JSON.parse(sessionStorage.getItem('navbot-ticket'));if(saved?.id&&languages.includes(saved.lang))state.ticket=saved}catch{}kiosk()}else{if(state.page==='tv'){state.audio=true;$('#controls').hidden=true}publicPoll();setInterval(async()=>{try{const s=(await api('/api/settings')).settings;state.settings={...defaults,...s};if(state.page==='tv'){state.lang=Math.max(0,languages.indexOf(state.settings.tv_language));NavI18n.setLanguage(languages[state.lang],false);publicTitle()}}catch{}},10000)}return}
 state.user=(await api('/api/me')).user;if(!state.user){login();return}if(state.page==='login'){location.href='/'+state.user.role;return}desk=state.user.operator||desk;if(state.user.must_change_password){shell();navigate('profile');return}state.users=(await api('/api/users')).users;await refreshPrivate();shell();if(state.user.must_change_password||state.page==='profile')navigate('profile');else if(state.user.role==='director')navigate('report');else navigate('requests');privatePoll();
 }catch(e){app.innerHTML=html`<main class="public-main"><section class="panel"><h1>NavBoTni oçib bölmadi</h1><p>${esc(e.message)}</p><button onclick="location.reload()">Qayta uriniş</button></section></main>`}})();
</script></body></html>
