# This site file is included inside the standard Ubuntu nginx http context.
server_tokens off;
limit_conn_zone $binary_remote_addr zone=navbot_connections:10m;
limit_req_zone $binary_remote_addr zone=navbot_login:10m rate=10r/m;

# LAN HTTP configuration. HTTPS and public deployment are separate steps.
server {
    listen 80;
    server_name 172.20.30.31 navbot.tsuull.uz;

    client_max_body_size 16m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 15s;

    limit_conn navbot_connections 32;
    limit_conn_status 429;
    limit_req_status 429;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_request_buffering on;

    location = /api/login {
        limit_req zone=navbot_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
