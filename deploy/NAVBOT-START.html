<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>NAVBOT</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 20% 20%,#164452,#081c32 70%);color:#edf9ff;font:20px system-ui,sans-serif;text-align:center}.brand{font-size:clamp(40px,8vw,80px);font-weight:850;letter-spacing:-2px}.brand span{color:#00dac6}p{font-size:18px;color:#b8d1df;margin-top:18px}.pulse{width:100px;height:4px;margin:30px auto;background:#00b8a6;border-radius:3px;animation:wait 1.2s infinite alternate}@keyframes wait{to{opacity:.25;transform:scaleX(.5)}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style></head><body><main><div class="brand">NAV<span>BOT</span></div><div class="pulse"></div><p>Serverga ulaniş kutilmoqda…</p></main><script>
